<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four link-port writes produce three differential audio states</title>
  <desc id="desc">Four side-by-side cards show port 00 writes 0 through 3. Write 0 releases both lines high and produces zero differential. Write 1 pulls line 0 low and produces negative differential. Write 2 pulls line 1 low and produces positive differential. Write 3 pulls both lines low and produces zero differential. The diagram describes logical states only, not voltage or load safety.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#94a3b8;stroke-width:2}.title{fill:#0f172a;font:700 30px system-ui,sans-serif}.subtitle{fill:#475569;font:17px system-ui,sans-serif}.head{fill:#0f172a;font:700 22px system-ui,sans-serif}.text{fill:#334155;font:17px system-ui,sans-serif}.small{fill:#475569;font:15px system-ui,sans-serif}.mono{fill:#0f172a;font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace}.bit{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.line0{stroke:#dc2626;stroke-width:5;fill:none}.line1{stroke:#2563eb;stroke-width:5;fill:none}.guide{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:6 6}.high{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.low{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.zero{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.positive{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.negative{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.note{fill:#fef3c7;stroke:#d97706;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="18"/>
  <text class="title" x="60" y="54">Four writes, three idealized differential states</text>
  <text class="subtitle" x="60" y="84">A set output bit pulls its line low; a clear bit releases its line high.</text>

  <g transform="translate(45 120)">
    <rect class="card" width="255" height="470" rx="14"/>
    <text class="head" x="127.5" y="42" text-anchor="middle">Write 0</text>
    <rect class="bit" x="62" y="60" width="131" height="46" rx="9"/>
    <text class="mono" x="127.5" y="90" text-anchor="middle">b1b0 = 00</text>
    <text class="small" x="28" y="145">line 0 · released</text>
    <path class="guide" d="M28 188 H227"/><path class="line0" d="M38 164 H217"/>
    <circle class="high" cx="207" cy="164" r="13"/><text class="mono" x="207" y="170" text-anchor="middle">H</text>
    <text class="small" x="28" y="240">line 1 · released</text>
    <path class="guide" d="M28 283 H227"/><path class="line1" d="M38 259 H217"/>
    <circle class="high" cx="207" cy="259" r="13"/><text class="mono" x="207" y="265" text-anchor="middle">H</text>
    <rect class="zero" x="28" y="330" width="199" height="78" rx="10"/>
    <text class="head" x="127.5" y="362" text-anchor="middle">zero</text>
    <text class="mono" x="127.5" y="391" text-anchor="middle">V0 − V1 = 0</text>
    <text class="small" x="127.5" y="442" text-anchor="middle">both released</text>
  </g>

  <g transform="translate(330 120)">
    <rect class="card" width="255" height="470" rx="14"/>
    <text class="head" x="127.5" y="42" text-anchor="middle">Write 1</text>
    <rect class="bit" x="62" y="60" width="131" height="46" rx="9"/>
    <text class="mono" x="127.5" y="90" text-anchor="middle">b1b0 = 01</text>
    <text class="small" x="28" y="145">line 0 · pulled low</text>
    <path class="guide" d="M28 164 H227"/><path class="line0" d="M38 188 H217"/>
    <circle class="low" cx="207" cy="188" r="13"/><text class="mono" x="207" y="194" text-anchor="middle">L</text>
    <text class="small" x="28" y="240">line 1 · released</text>
    <path class="guide" d="M28 283 H227"/><path class="line1" d="M38 259 H217"/>
    <circle class="high" cx="207" cy="259" r="13"/><text class="mono" x="207" y="265" text-anchor="middle">H</text>
    <rect class="negative" x="28" y="330" width="199" height="78" rx="10"/>
    <text class="head" x="127.5" y="362" text-anchor="middle">negative</text>
    <text class="mono" x="127.5" y="391" text-anchor="middle">V0 − V1 &lt; 0</text>
    <text class="small" x="127.5" y="442" text-anchor="middle">opposite polarity A</text>
  </g>

  <g transform="translate(615 120)">
    <rect class="card" width="255" height="470" rx="14"/>
    <text class="head" x="127.5" y="42" text-anchor="middle">Write 2</text>
    <rect class="bit" x="62" y="60" width="131" height="46" rx="9"/>
    <text class="mono" x="127.5" y="90" text-anchor="middle">b1b0 = 10</text>
    <text class="small" x="28" y="145">line 0 · released</text>
    <path class="guide" d="M28 188 H227"/><path class="line0" d="M38 164 H217"/>
    <circle class="high" cx="207" cy="164" r="13"/><text class="mono" x="207" y="170" text-anchor="middle">H</text>
    <text class="small" x="28" y="240">line 1 · pulled low</text>
    <path class="guide" d="M28 259 H227"/><path class="line1" d="M38 283 H217"/>
    <circle class="low" cx="207" cy="283" r="13"/><text class="mono" x="207" y="289" text-anchor="middle">L</text>
    <rect class="positive" x="28" y="330" width="199" height="78" rx="10"/>
    <text class="head" x="127.5" y="362" text-anchor="middle">positive</text>
    <text class="mono" x="127.5" y="391" text-anchor="middle">V0 − V1 &gt; 0</text>
    <text class="small" x="127.5" y="442" text-anchor="middle">opposite polarity B</text>
  </g>

  <g transform="translate(900 120)">
    <rect class="card" width="255" height="470" rx="14"/>
    <text class="head" x="127.5" y="42" text-anchor="middle">Write 3</text>
    <rect class="bit" x="62" y="60" width="131" height="46" rx="9"/>
    <text class="mono" x="127.5" y="90" text-anchor="middle">b1b0 = 11</text>
    <text class="small" x="28" y="145">line 0 · pulled low</text>
    <path class="guide" d="M28 164 H227"/><path class="line0" d="M38 188 H217"/>
    <circle class="low" cx="207" cy="188" r="13"/><text class="mono" x="207" y="194" text-anchor="middle">L</text>
    <text class="small" x="28" y="240">line 1 · pulled low</text>
    <path class="guide" d="M28 259 H227"/><path class="line1" d="M38 283 H217"/>
    <circle class="low" cx="207" cy="283" r="13"/><text class="mono" x="207" y="289" text-anchor="middle">L</text>
    <rect class="zero" x="28" y="330" width="199" height="78" rx="10"/>
    <text class="head" x="127.5" y="362" text-anchor="middle">zero</text>
    <text class="mono" x="127.5" y="391" text-anchor="middle">V0 − V1 = 0</text>
    <text class="small" x="127.5" y="442" text-anchor="middle">both pulled low</text>
  </g>

  <rect class="note" x="150" y="625" width="900" height="58" rx="10"/>
  <text class="text" x="600" y="649" text-anchor="middle">Logical high/low states only — no voltage, impedance, bandwidth, or safe-load claim.</text>
  <text class="small" x="600" y="672" text-anchor="middle">The open-collector schematic above supplies the electrical model; physical values remain unmeasured.</text>
</svg>
