<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bad Apple timer cadence separates register decode, encoder tuning, and trace observation</title>
  <desc id="desc">Three horizontal evidence lanes distinguish the programmed timer path from two other numbers. The programmed path selects nominal 15 megahertz, divides by 4 through source 82, reloads 120, and yields a nominal 31,250 interrupts per second; dividing by 1,800 gives about 17.36 tracker updates per second. A separate encoder lane shows the upstream 33,333.3 hertz tuning assumption used for note counts and rendering. A trace lane shows about 4,674 port writes per interpreted second from one injected TilEm run and labels it diagnostic rather than physical hardware evidence.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.title{fill:#0f172a;font:700 30px system-ui,sans-serif}.subtitle{fill:#475569;font:17px system-ui,sans-serif}.lanehead{fill:#0f172a;font:700 22px system-ui,sans-serif}.head{fill:#0f172a;font:700 18px system-ui,sans-serif}.text{fill:#334155;font:16px system-ui,sans-serif}.small{fill:#475569;font:14px system-ui,sans-serif}.mono{fill:#0f172a;font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace}.program{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.register{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.derived{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.assumption{fill:#fef3c7;stroke:#d97706;stroke-width:2}.trace{fill:#f3e8ff;stroke:#9333ea;stroke-width:2}.warning{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none}.divider{stroke:#cbd5e1;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760" rx="18"/>
  <text class="title" x="60" y="54">Three cadence numbers answer three different questions</text>
  <text class="subtitle" x="60" y="84">Only the top lane decodes the timer registers; the other lanes preserve source and trace evidence.</text>

  <rect class="panel" x="60" y="120" width="1080" height="270" rx="14"/>
  <text class="lanehead" x="88" y="155">Programmed timer path</text>
  <text class="small" x="1110" y="153" text-anchor="end">application bytes + documented timer decode</text>

  <rect class="program" x="88" y="184" width="174" height="76" rx="10"/>
  <text class="head" x="175" y="213" text-anchor="middle">CPU-speed request</text>
  <text class="mono" x="175" y="241" text-anchor="middle">port 20 = 1</text>
  <path class="arrow" d="M262 222 H303"/>
  <rect class="derived" x="304" y="184" width="154" height="76" rx="10"/>
  <text class="head" x="381" y="213" text-anchor="middle">nominal clock</text>
  <text class="mono" x="381" y="241" text-anchor="middle">15 MHz</text>
  <path class="arrow" d="M458 222 H499"/>
  <rect class="register" x="500" y="184" width="154" height="76" rx="10"/>
  <text class="head" x="577" y="213" text-anchor="middle">source 0x82</text>
  <text class="mono" x="577" y="241" text-anchor="middle">÷ 4</text>
  <path class="arrow" d="M654 222 H695"/>
  <rect class="register" x="696" y="184" width="154" height="76" rx="10"/>
  <text class="head" x="773" y="213" text-anchor="middle">counter 120</text>
  <text class="mono" x="773" y="241" text-anchor="middle">÷ 120</text>
  <path class="arrow" d="M850 222 H891"/>
  <rect class="derived" x="892" y="174" width="220" height="96" rx="10"/>
  <text class="head" x="1002" y="207" text-anchor="middle">nominal ISR cadence</text>
  <text class="mono" x="1002" y="238" text-anchor="middle">31,250 Hz</text>
  <text class="small" x="1002" y="259" text-anchor="middle">not a physical measurement</text>

  <path class="arrow" d="M1002 270 V306 H835"/>
  <rect class="register" x="624" y="286" width="210" height="74" rx="10"/>
  <text class="head" x="729" y="314" text-anchor="middle">tracker divider</text>
  <text class="mono" x="729" y="341" text-anchor="middle">24 × 75 = 1,800</text>
  <path class="arrow" d="M624 323 H564"/>
  <rect class="derived" x="344" y="286" width="220" height="74" rx="10"/>
  <text class="head" x="454" y="314" text-anchor="middle">nominal tracker cadence</text>
  <text class="mono" x="454" y="341" text-anchor="middle">17.36 updates/s</text>

  <rect class="panel" x="60" y="420" width="1080" height="118" rx="14"/>
  <text class="lanehead" x="88" y="455">Encoder assumption</text>
  <rect class="assumption" x="390" y="441" width="220" height="76" rx="10"/>
  <text class="head" x="500" y="470" text-anchor="middle">software assumption</text>
  <text class="mono" x="500" y="498" text-anchor="middle">33,333.3 Hz</text>
  <path class="arrow" d="M610 479 H679"/>
  <rect class="assumption" x="680" y="441" width="340" height="76" rx="10"/>
  <text class="head" x="850" y="470" text-anchor="middle">note counters + checked-in render</text>
  <text class="small" x="850" y="498" text-anchor="middle">preserved for upstream compatibility</text>

  <rect class="panel" x="60" y="568" width="1080" height="118" rx="14"/>
  <text class="lanehead" x="88" y="603">TilEm trace observation</text>
  <rect class="trace" x="390" y="589" width="220" height="76" rx="10"/>
  <text class="head" x="500" y="618" text-anchor="middle">observed port writes</text>
  <text class="mono" x="500" y="646" text-anchor="middle">≈ 4,674 / s</text>
  <path class="arrow" d="M610 627 H679"/>
  <rect class="warning" x="680" y="589" width="340" height="76" rx="10"/>
  <text class="head" x="850" y="618" text-anchor="middle">diagnostic run result</text>
  <text class="small" x="850" y="646" text-anchor="middle">not TI-84 Plus hardware cadence</text>

  <text class="subtitle" x="600" y="726" text-anchor="middle">Physical cadence remains a measurement question because CPU frequency varies and timer edges are unresolved.</text>
</svg>
