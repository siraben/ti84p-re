<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">TI-84 Plus LCD addressing overlaid on a TilEm calculator skin</title>
  <desc id="desc">A TilEm TI-84 Plus calculator skin locates a row and byte-column overlay on the physical LCD. A larger controller view shows twelve visible byte columns, four off-screen controller columns, sixty-four pixel rows, and the eight horizontal pixels controlled by one data byte. Port 10 changes the row and byte-column counters; port 11 transfers the selected byte.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.title{fill:#0f172a;font:700 30px system-ui,sans-serif}.head{fill:#0f172a;font:700 20px system-ui,sans-serif}.text{fill:#334155;font:16px system-ui,sans-serif}.small{fill:#475569;font:14px system-ui,sans-serif}.mono{fill:#0f172a;font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace}.cmd{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.data{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.visible{fill:#ecfeff;stroke:#0891b2;stroke-width:3}.off{fill:#f1f5f9;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}.grid{stroke:#64748b;stroke-width:1}.row{fill:#bfdbfe;stroke:#2563eb;stroke-width:2}.column{fill:#fef3c7;stroke:#d97706;stroke-width:2}.selected{fill:#fed7aa;stroke:#c2410c;stroke-width:2}.note{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <clipPath id="lcd-clip"><rect x="168" y="218" width="163" height="109" rx="4"/></clipPath>
  </defs>

  <rect class="bg" width="1400" height="840" rx="18"/>
  <text class="title" x="60" y="54">LCD addressing on the calculator: row × byte column × data bits</text>
  <text class="text" x="60" y="84">The calculator view locates the mapping; the enlarged controller view exposes storage that the bezel hides.</text>

  <rect class="panel" x="60" y="120" width="380" height="680" rx="14"/>
  <image href="tilem-ti84p-skin.png" xlink:href="tilem-ti84p-skin.png" x="105" y="135" width="290" height="619" preserveAspectRatio="xMidYMid meet"/>
  <g clip-path="url(#lcd-clip)">
    <rect x="168" y="218" width="163" height="109" fill="#ecfeff" opacity="0.22"/>
    <path class="grid" opacity="0.72" d="M181.6 218 V327 M195.2 218 V327 M208.8 218 V327 M222.3 218 V327 M235.9 218 V327 M249.5 218 V327 M263.1 218 V327 M276.7 218 V327 M290.3 218 V327 M303.8 218 V327 M317.4 218 V327"/>
    <rect class="column" x="222.3" y="218" width="13.6" height="109" opacity="0.62"/>
    <rect class="row" x="168" y="268" width="163" height="7" opacity="0.72"/>
    <rect class="selected" x="222.3" y="268" width="13.6" height="7"/>
  </g>
  <rect x="168" y="218" width="163" height="109" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
  <rect class="row" x="95" y="762" width="20" height="12" rx="3"/><text class="small" x="124" y="773">selected pixel row</text>
  <rect class="column" x="95" y="782" width="20" height="12" rx="3"/><text class="small" x="124" y="793">selected byte column</text>

  <rect class="panel" x="470" y="120" width="870" height="520" rx="14"/>
  <text class="head" x="500" y="158">Ports select one controller byte at a time</text>

  <rect class="cmd" x="500" y="180" width="240" height="85" rx="10"/>
  <text class="head" x="620" y="212" text-anchor="middle">port 10 · command</text>
  <text class="text" x="620" y="241" text-anchor="middle">row, column, mode, contrast</text>
  <path class="arrow" d="M740 222.5 H797"/>

  <rect class="cmd" x="800" y="180" width="510" height="85" rx="10"/>
  <text class="head" x="1055" y="207" text-anchor="middle">T6K04 address counters</text>
  <text class="mono" x="1055" y="232" text-anchor="middle">80h + r → row 0–63 · 20h + c → byte column 0–15</text>
  <text class="small" x="1055" y="253" text-anchor="middle">commands select an address; they do not copy display RAM</text>

  <text class="head" x="1040" y="298" text-anchor="middle">Controller row at address r</text>
  <rect class="visible" x="800" y="310" width="360" height="170" rx="6"/>
  <rect class="off" x="1160" y="310" width="120" height="170" rx="6"/>
  <rect class="column" x="920" y="310" width="30" height="170" opacity="0.56"/>
  <rect class="row" x="800" y="390" width="480" height="10" opacity="0.68"/>
  <rect class="selected" x="920" y="390" width="30" height="10"/>
  <g class="grid">
    <path d="M830 310 V480 M860 310 V480 M890 310 V480 M920 310 V480 M950 310 V480 M980 310 V480 M1010 310 V480 M1040 310 V480 M1070 310 V480 M1100 310 V480 M1130 310 V480"/>
    <path d="M1190 310 V480 M1220 310 V480 M1250 310 V480"/>
    <path d="M800 350 H1280 M800 390 H1280 M800 400 H1280 M800 440 H1280"/>
  </g>
  <text class="head" x="980" y="340" text-anchor="middle">12 visible byte columns = 96 pixels</text>
  <text class="text" x="1220" y="340" text-anchor="middle">4 extra</text>
  <text class="text" x="1220" y="365" text-anchor="middle">controller</text>
  <text class="text" x="1220" y="390" text-anchor="middle">columns</text>
  <text class="mono" x="935" y="375" text-anchor="middle">c</text>
  <text class="mono" x="835" y="386">row r</text>
  <text class="small" x="1040" y="504" text-anchor="middle">Row bands are enlarged here; the controller stores 64 one-pixel rows.</text>

  <rect class="data" x="500" y="515" width="240" height="85" rx="10"/>
  <text class="head" x="620" y="547" text-anchor="middle">port 11 · data</text>
  <text class="text" x="620" y="576" text-anchor="middle">read or write current unit</text>
  <path class="arrow" d="M740 557.5 H797"/>

  <rect class="data" x="800" y="515" width="510" height="85" rx="10"/>
  <text class="mono" x="1055" y="548" text-anchor="middle">data byte b7 b6 b5 b4 b3 b2 b1 b0</text>
  <text class="text" x="1055" y="577" text-anchor="middle">eight adjacent horizontal pixels at the selected (r, c) address</text>

  <rect class="panel" x="470" y="665" width="870" height="135" rx="14"/>
  <rect class="note" x="490" y="685" width="260" height="95" rx="10"/>
  <text class="mono" x="620" y="717" text-anchor="middle">command 07h</text>
  <text class="text" x="620" y="746" text-anchor="middle">increment byte column</text>
  <text class="small" x="620" y="768" text-anchor="middle">after each transfer</text>
  <rect class="note" x="780" y="685" width="260" height="95" rx="10"/>
  <text class="mono" x="910" y="717" text-anchor="middle">command 05h</text>
  <text class="text" x="910" y="746" text-anchor="middle">increment pixel row</text>
  <text class="small" x="910" y="768" text-anchor="middle">after each transfer</text>
  <rect class="cmd" x="1070" y="685" width="250" height="95" rx="10"/>
  <text class="head" x="1195" y="717" text-anchor="middle">Read latch</text>
  <text class="text" x="1195" y="746" text-anchor="middle">first read returns old data</text>
  <text class="mono" x="1195" y="770" text-anchor="middle">dummy → useful</text>

  <text class="small" x="60" y="826">Calculator image: TilEm TI-84 Plus skin, GPL-3.0-or-later; source and license are recorded beside the asset.</text>
</svg>
